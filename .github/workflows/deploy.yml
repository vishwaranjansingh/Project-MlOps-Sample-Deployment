name: CI/CD Pipeline - Train, Package & Deploy ML Model to AKS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.AZURE_ACR_NAME || 'myacrregistry' }}
  IMAGE_NAME: mind-eval-model
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-mlops-prod' }}
  CLUSTER_NAME: ${{ secrets.AZURE_AKS_CLUSTER || 'aks-mlops-prod' }}

jobs:
  train-and-test:
    name: Model Training & Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Model & Generate model.pkl
        run: |
          python src/train.py

      - name: Run API Sanity & Unit Tests
        run: |
          pytest tests/ -v

      - name: Upload Trained Model Artifact
        uses: actions/upload-artifact@v3
        with:
          name: model-artifact
          path: models/model.pkl

  build-and-push-container:
    name: Build & Push Docker Image to ACR
    needs: train-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download Model Artifact
        uses: actions/download-artifact@v3
        with:
          name: model-artifact
          path: models/

      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Tag Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG} .
          docker tag ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG} ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Push Container Image to ACR
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

  deploy-to-aks:
    name: Deploy to Azure Kubernetes Service (AKS)
    needs: build-and-push-container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Cluster Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Substitute Variables in Manifests & Deploy to AKS
        run: |
          IMAGE_TAG=${{ github.sha }}
          
          kubectl apply -f k8s/namespace.yaml
          
          # Replace dynamic placeholder variables in deployment manifest
          sed -i "s/\${ACR_NAME}/${{ env.ACR_NAME }}/g" k8s/deployment.yaml
          sed -i "s/\${IMAGE_TAG}/${IMAGE_TAG}/g" k8s/deployment.yaml
          
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          
          kubectl rollout status deployment/mind-eval-model-deployment -n mlops-system --timeout=180s
