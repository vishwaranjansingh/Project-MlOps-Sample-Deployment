apiVersion: apps/v1
kind: Deployment
metadata:
  name: mind-eval-model-deployment
  namespace: mlops-system
  labels:
    app.kubernetes.io/name: mind-eval-model
    app.kubernetes.io/component: inference-api
    app.kubernetes.io/part-of: mlops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mind-eval-model
  template:
    metadata:
      labels:
        app: mind-eval-model
    spec:
      containers:
      - name: mind-eval-api
        image: ${ACR_NAME}.azurecr.io/mind-eval-model:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MODEL_PATH
          value: "/app/models/model.pkl"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
