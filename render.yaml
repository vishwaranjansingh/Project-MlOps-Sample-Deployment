services:
  - type: web
    name: mind-eval-model-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python src/train.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: models/model.pkl
      - key: PYTHON_VERSION
        value: 3.10.12
